`).join('')}</section></div>`}

  function reportsPage(){const reports=[['تقرير فحص التربة','مركز الأعمال - واجهة الرياض','م. نورة الشمري','بانتظار المراجعة','orange'],['تقرير تقدم الأعمال','مجمع سكني - حي النرجس','م. خالد الحربي','بانتظار المراجعة','orange'],['تقرير الموقع الأولي','توسعة طريق الملك سلمان','م. خالد الحربي','بحاجة إلى تعديل','red'],['التقرير الختامي','مستودع لوجستي - السلي','م. فهد الدوسري','معتمد','green']];return `<div class="page-heading"><div><div class="eyebrow">مراجعة واعتماد</div><h1>التقارير والاعتمادات</h1><p>راجع التقارير الميدانية، أضف ملاحظاتك، ثم اعتمدها أو أعدها للمهندس.</p></div><button class="btn" data-action="export-approved">${icon('download')} تصدير المعتمد</button></div><section class="stats">${[['بانتظار المراجعة',3,'تتطلب إجراءً','clipboard'],['معتمدة',12,'خلال هذا الشهر','check'],['بحاجة إلى تعديل',1,'أعيدت للمهندس','edit'],['وقت المراجعة','1.4 يوم','متوسط دورة الاعتماد','clock']].map(statCard).join('')}</section><section class="panel"><div class="panel-head"><div><div class="panel-title">سجل التقارير</div><div class="panel-subtitle">تقرير الموقع يتضمن بيانات التربة والتراخيص والموارد والمرفقات</div></div><select class="filter-select"><option>كل التقارير</option><option>بانتظار المراجعة</option><option>معتمدة</option></select></div><div class="reports-list">${reports.map((r,i)=>`<div class="report-item"><div><b>${r[0]}</b><small>${r[1]} · ${r[2]} · ${i===0?'اليوم، 10:42 ص':'30 سبتمبر'}</small></div><span class="status ${r[4]}">${r[3]}</span><div class="report-actions"><button class="btn" data-action="preview-report" data-report="${i}">${icon('file')} معاينة</button>${r[4]!=='green'?`<button class="btn primary" data-action="approve" data-report="${i}">${icon('check')} اعتماد</button>`:''}</div></div>`).join('')}</div></section>`}
  function setHeader(){let eng=isEng(),name=eng?'م. نورة الشمري':'م. ماجد العتيبي',title=eng?'مهندسة ميدانية':'مدير المشاريع';document.getElementById('side-name').textContent=name;document.getElementById('side-role').textContent=title;document.getElementById('side-avatar').textContent=eng?'ن ش':'م ع';document.getElementById('top-name').textContent=name;document.getElementById('top-title').textContent=title;document.getElementById('top-avatar').textContent=eng?'ن ش':'م ع';document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role));document.getElementById('crumb-title').textContent=navItems().find(n=>n[0]===section)?.[1]||'لوحة التحكم'}
  function syncEngineerProgress(){const ownTasks=myTasks(),done=ownTasks.filter(t=>t.state==='done').length,percent=ownTasks.length?Math.round(done/ownTasks.length*100):0;const label=document.querySelector('.progress-line b'),fill=document.querySelector('.progress-fill'),notes=document.querySelector('.progress-notes');if(label)label.textContent=percent+'%';if(fill)fill.style.width=percent+'%';if(notes){notes.firstElementChild.textContent=done+' مهام مكتملة';notes.lastElementChild.textContent=ownTasks.length+' إجمالي المهام'}}
  function render(){setHeader();renderNav();let pages={dashboard,profile:profilePage,tasks:tasksPage,projects:projectsPage,team:teamPage,reports:reportsPage};document.getElementById('content').innerHTML=(pages[section]||dashboard)();if(isEng()&&section==='dashboard')syncEngineerProgress();if(window.lucide)lucide.createIcons();wireCommon();if(section==='dashboard'||section==='projects')initMap();if(section==='team')wireChat();if(section==='tasks')wireTaskFilter()}
  function initMap(){const mapEl=document.getElementById('map');if(!mapEl)return;if(!window.L){mapEl.innerHTML='<div style="display:grid;place-items:center;height:100%;color:#777;font-size:12px">تعذر تحميل الخريطة. تحقق من الاتصال بالإنترنت.</div>';return}const map=L.map(mapEl,{scrollWheelZoom:false}).setView([24.72,46.68],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);let visible=isEng()?projects.filter(p=>tasks.some(t=>t.owner==='م. نورة الشمري'&&t.project===p.name)):projects;visible.forEach(p=>{let color=markerColor(p),marker=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:`<div class="custom-marker" style="background:${color}"></div>`,iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);marker.bindPopup(`<b>${p.name}</b><br>${p.id} · ${p.engineer}<br><span style="color:${color}">${projectStatus(p)[0]} · ${p.progress}% إنجاز</span>`);marker.on('click',()=>{if(section==='projects')showProject(p.id)})});if(visible.length>1)map.fitBounds(visible.map(p=>[p.lat,p.lng]),{padding:[25,25]});window.setTimeout(()=>map.invalidateSize(),100)}
  function showProject(id){const p=projects.find(x=>x.id===id);if(!p)return;selectedProject=id;const box=document.getElementById('project-detail');let status=projectStatus(p),permitColor=p.permit==='سارية'?'':p.permit==='متأخرة'?'red':'orange';box.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><span class="status ${status[1]}">${status[0]}</span><button class="icon-button" data-action="close-project" aria-label="إغلاق">${icon('close')}</button></div><h3>${p.name}</h3><p>${p.description}</p><div class="detail-grid"><div class="detail-field"><label>نوع التربة · قابل للتعديل</label><select data-project-field="soil" data-id="${p.id}">${['رملية','صخرية','طينية','جيرية'].map(x=>`<option ${p.soil===x?'selected':''}>${x}</option>`)}</select></div><div class="detail-field"><label>درجة الانحدار</label><input data-project-field="slope" data-id="${p.id}" value="${p.slope}"></div><div class="detail-field"><label>المنسوب الارتفاعي</label><input data-project-field="elevation" data-id="${p.id}" value="${p.elevation}"></div><div class="detail-field"><label>تقييم الموقع المبدئي</label><select data-project-field="assessment" data-id="${p.id}">${['مناسب للبناء التجاري','مناسب للبناء السكني','مناسب للإنشاءات الصناعية','مناسب لأعمال الطرق','يحتاج معالجة للتربة','غير مناسب لأسباب طبوغرافية'].map(x=>`<option ${p.assessment===x?'selected':''}>${x}</option>`)}</select></div><div class="detail-field"><label>عدد العمالة الفعالة</label><input type="number" data-project-field="workers" data-id="${p.id}" value="${p.workers}"></div><div class="detail-field"><label>حالة التوريدات</label><select data-project-field="materials" data-id="${p.id}">${['متوفرة','قيد الطلب','متأخرة'].map(x=>`<option ${p.materials===x?'selected':''}>${x}</option>`)}</select></div></div><p style="font-size:9px;margin:8px 0 0">${icon('edit')} آخر تحديث ميداني: ${p.engineer} · ${p.updated}</p><div class="permit-card"><span class="permit-symbol ${permitColor}">${icon('shield')}</span><div>   render=function(){renderBeforeTodaySeparation();separateDueTodayTasks();if(window.lucide)lucide.createIcons()};
  render();
  </script>
